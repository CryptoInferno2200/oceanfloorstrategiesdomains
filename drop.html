<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OFS Domains — Zip drop</title>
  <style>
    :root { --bg:#041016; --fg:#eef4f2; --muted:#9bb0aa; --card:rgba(8,22,28,.88); --line:rgba(238,244,242,.12); }
    * { box-sizing: border-box; }
    body { margin:0; font:16px/1.5 ui-sans-serif,system-ui; background:var(--bg); color:var(--fg); }
    header, main { max-width:720px; margin:0 auto; padding:24px 20px; }
    nav { display:flex; flex-wrap:wrap; gap:8px; margin:12px 0 0; }
    nav a { color:var(--muted); text-decoration:none; font-size:13px; padding:8px 12px; border-radius:999px; box-shadow:0 0 0 1px var(--line); }
    nav a.on { color:var(--fg); background:var(--card); }
    h1 { font-family:Georgia,serif; font-weight:400; letter-spacing:-.03em; }
    .k, .lead, label { color:var(--muted); }
    .k { font-size:11px; letter-spacing:.16em; text-transform:uppercase; }
    .card { margin-top:16px; padding:18px; border-radius:16px; background:var(--card); box-shadow:0 0 0 1px var(--line); }
    .drop { min-height:180px; display:flex; align-items:center; justify-content:center; text-align:center; border-radius:16px; box-shadow:inset 0 0 0 1px var(--line); cursor:pointer; }
    .drop.on { box-shadow:inset 0 0 0 2px #cfe4dc; }
    input[type=file] { display:none; }
    input[type=text] { width:100%; height:44px; border:0; border-radius:12px; padding:0 12px; background:#07161c; color:var(--fg); box-shadow:0 0 0 1px var(--line); font:inherit; }
    button, .btn { height:48px; border:0; border-radius:12px; padding:0 18px; background:var(--fg); color:var(--bg); font-weight:600; cursor:pointer; font:inherit; }
    ul { margin:8px 0 0; padding-left:18px; color:var(--muted); max-height:220px; overflow:auto; }
    .err { color:#e0b7b0; }
    iframe { width:100%; min-height:280px; border:0; border-radius:12px; background:#07161c; margin-top:12px; }
  </style>
  <link rel="stylesheet" href="./reef-bg.css" />
</head>
<body>
<canvas id="ofs-reef" class="ofs-reef" aria-hidden="true"></canvas>

  <header>
    <div class="k">No copy paste</div>
    <h1>Drop a zip. We start the project.</h1>
    <p class="lead">AI unpacks the archive, finds the start file, parks it on OFS Host, and opens a preview. You do not paste code.</p>
    <nav>
      <a href="home.html">Home</a>
      <a href="auto.html">Auto</a>
      <a class="on" href="drop.html">Zip drop</a>
      <a href="host.html">Host</a>
      <a href="vault.html">Vault</a>
    </nav>
  </header>
  <main>
    <label class="drop card" id="zone" for="file">Drop a .zip here or tap to choose</label>
    <input id="file" type="file" accept=".zip,application/zip" />
    <p class="err" id="err"></p>
    <p class="lead" id="ok"></p>
    <div class="card" id="meta" hidden>
      <div class="k">Unpacked</div>
      <p id="sum"></p>
      <label for="fqdn">Name to host</label>
      <input id="fqdn" placeholder="yourbrand.com" />
      <button type="button" id="go" style="margin-top:12px;width:100%">Start project</button>
      <ul id="tree"></ul>
    </div>
    <div class="card" id="live" hidden>
      <div class="k">Running</div>
      <p id="run"></p>
      <iframe id="frame" title="Project preview" sandbox="" referrerpolicy="no-referrer"></iframe>
      <p><a id="toHost" href="host.html">Open host</a></p>
    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
  <script src="./host.js"></script>
  <script src="./purchases.js"></script>
  <script src="./zip.js"></script>
  <script src="./assets/js/drop-inline-1.js"></script>
  <script src="./mail.js"></script>
  <script src="./support.js"></script>
  <script src="./reef-bg.js"></script>
</body>
</html>
