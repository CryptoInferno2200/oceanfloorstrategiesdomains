# OFS Domains — Netlify. No build. Folder is the site.
[build]
  publish = "."
  command = "true"

[build.environment]
  NODE_VERSION = "20"

[functions]
  directory = "netlify/functions"

# The repo root is the publish folder, so keep source, schema, and archives off the public site.
[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/node_modules/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/downloads/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/package.json"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/package-lock.json"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/README.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/REPUBLISH.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/cloudflare-pages.txt"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/netlify.toml"
  to = "/404.html"
  status = 404
  force = true

# Internal notes for whoever records the tour videos.
[[redirects]]
  from = "/assets/tour/README.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/"
  to = "/home.html"
  status = 200
  force = true

[[redirects]]
  from = "/index.html"
  to = "/home.html"
  status = 200
  force = true

[[redirects]]
  from = "/oauth.html"
  to = "/home.html"
  status = 301
  force = true

[[redirects]]
  from = "/verify.html"
  to = "/home.html"
  status = 301
  force = true

[[redirects]]
  from = "/reset.html"
  to = "/home.html"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Permissions-Policy = "camera=(), microphone=(self), geolocation=()"
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; script-src 'self' https://esm.sh https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; connect-src 'self' https://esm.sh https://oauth2.googleapis.com; frame-src 'self' blob:; form-action 'self' https://buy.stripe.com; worker-src 'self' blob:; upgrade-insecure-requests"

[[headers]]
  for = "/home.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[redirects]]
  from = "/reef.html"
  to = "/vault.html"
  status = 301

[[redirects]]
  from = "/reef"
  to = "/vault.html"
  status = 301
