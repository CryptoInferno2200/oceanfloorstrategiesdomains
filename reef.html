<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#041016" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icon.svg" />
  <title>OFS Domains — Reef</title>
  <style>
    :root { --bg:#041016; --fg:#eef4f2; --muted:#9bb0aa; --card:rgba(8,22,28,.82); --line:rgba(238,244,242,.12); }
    * { box-sizing: border-box; }
    body { margin:0; font: 16px/1.45 ui-sans-serif, system-ui; background:var(--bg); color:var(--fg); }
    header, main { max-width: 720px; margin: 0 auto; padding: 24px 20px; }
    nav { display:flex; flex-wrap:wrap; gap:8px; margin: 12px 0 0; }
    nav a { color:var(--muted); text-decoration:none; font-size:13px; padding:8px 12px; border-radius:999px; box-shadow:0 0 0 1px var(--line); }
    nav a.on { color:var(--fg); background:var(--card); }
    h1 { font-family: Georgia, serif; font-weight:400; letter-spacing:-.03em; }
    p.lead, .k { color:var(--muted); }
    .k { font-size:11px; letter-spacing:.16em; text-transform:uppercase; }
    canvas { width:100%; height:320px; border-radius:16px; display:block; background:#07222c; }
    input { width:100%; height:48px; border:0; border-radius:12px; padding:0 14px; background:var(--card); color:var(--fg); box-shadow:0 0 0 1px var(--line); margin: 12px 0; }
  </style>
  <link rel="stylesheet" href="./reef-bg.css" />
</head>
<body>
<canvas id="ofs-reef" class="ofs-reef" aria-hidden="true"></canvas>

  <header>
    <div class="k">Living reef</div>
    <h1 id="title">kelpchart.com</h1>
    <p class="lead" id="line">Every name already has a body.</p>
    <nav>
      <a href="home.html">Home</a>
      <a href="auto.html">Auto</a>
      <a href="bundle.html">Products</a>
      <a href="checkout.html">Checkout</a>
      <a href="profile.html">Profile</a>
      <a href="vault.html">Vault</a>
      <a class="on" href="reef.html">Reef</a>
      <a href="bind.html">Bind</a>
      <a href="host.html">Host</a>
      <a href="live.html">Go live</a>
    </nav>
  </header>
  <main>
    <input id="fqdn" value="kelpchart.com" />
    <canvas id="reef" width="720" height="320"></canvas>
  </main>
  <script src="./assets/js/reef-inline-1.js"></script>
<script src="./mail.js"></script>
<script src="./support.js"></script>
  <script src="./reef-bg.js"></script>
</body>
</html>
