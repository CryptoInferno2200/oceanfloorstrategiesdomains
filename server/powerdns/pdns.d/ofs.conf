# Authoritative only. No recursion, so the server cannot be used as an open resolver.
api=yes
webserver=yes
webserver-address=0.0.0.0
webserver-port=8081
# Only the Caddy container on the compose network reaches the API.
webserver-allow-from=127.0.0.1,172.16.0.0/12,10.0.0.0/8
default-ttl=3600
# Secondary nameservers receive zones by AXFR + NOTIFY. Set to ns2's IP on the primary.
# allow-axfr-ips=203.0.113.20
# also-notify=203.0.113.20
# primary=yes
