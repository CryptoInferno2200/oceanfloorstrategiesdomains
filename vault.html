<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#041016" />
  <title>OFS Domains — Vault</title>
  <link rel="icon" href="./icon.svg" />
  <style>
    :root { --bg:#041016; --fg:#eef4f2; --muted:#9bb0aa; --card:rgba(8,22,28,.88); --line:rgba(238,244,242,.12); }
    * { box-sizing: border-box; }
    body { margin:0; font:16px/1.5 ui-sans-serif,system-ui; background:var(--bg); color:var(--fg); }
    header, main { max-width:720px; margin:0 auto; padding:24px 20px; }
    nav { display:flex; flex-wrap:wrap; gap:8px; margin:12px 0 0; }
    nav a { color:var(--muted); text-decoration:none; font-size:13px; padding:8px 12px; border-radius:999px; box-shadow:0 0 0 1px var(--line); }
    nav a.on { color:var(--fg); background:var(--card); }
    h1 { font-family:Georgia,serif; font-weight:400; letter-spacing:-.03em; }
    .k, .lead { color:var(--muted); }
    .k { font-size:11px; letter-spacing:.16em; text-transform:uppercase; }
    .card { margin-top:16px; padding:18px; border-radius:16px; background:var(--card); box-shadow:0 0 0 1px var(--line); }
    ul { margin:10px 0 0; padding-left:18px; color:var(--muted); }
    li { margin:8px 0; }
  </style>
  <link rel="stylesheet" href="./reef-bg.css" />
</head>
<body>
<canvas id="ofs-reef" class="ofs-reef" aria-hidden="true"></canvas>

  <header>
    <div class="k">OFS Vault</div>
    <h1>Vault.</h1>
    <p class="lead">Every service this seat bought or received complimentary. Whitelist lives here too.</p>
    <nav>
      <a href="home.html">Home</a>
      <a href="auto.html">Auto</a>
      <a href="bundle.html">Products</a>
      <a href="profile.html">Profile</a>
      <a class="on" href="vault.html">Vault</a>
      <a href="host.html">Host</a>
      <a href="live.html">Go live</a>
    </nav>
  </header>
  <main>
    <div class="card">
      <div class="k">Purchases</div>
      <p class="lead" id="who">Sign in to attach this vault to a seat.</p>
      <ul id="history"></ul>
    </div>
    <div class="card">
      <div class="k">Whitelist</div>
      <ul id="white-list"></ul>
    </div>
  </main>
  <script src="./auth.js"></script>
  <script src="./purchases.js"></script>
  <script>
    const seat = OFSSeat.load().session;
    document.getElementById("who").textContent = seat ? ("Vault for " + seat) : "Vault on this device. Sign in on Home to attach a seat.";
    const rows = OFSPurchases.forAccount();
    document.getElementById("history").innerHTML = rows.length
      ? rows.map((r) => {
          const pay = r.complimentary || r.due === 0 ? "complimentary" : "$" + Number(r.due).toFixed(2);
          return "<li>" + r.label + " · " + (r.fqdn || "—") + " · " + pay + " · " + new Date(r.at).toLocaleString() + "</li>";
        }).join("")
      : "<li>Vault is empty until a name is claimed or a plan is paid.</li>";
    const invited = OFSSeat.listWhitelist ? OFSSeat.listWhitelist() : [];
    document.getElementById("white-list").innerHTML = invited.length
      ? invited.map((r) => "<li>" + r.email + " · " + r.status + (r.operator ? " · operator" : "") + "</li>").join("")
      : "<li>No whitelist emails yet.</li>";
  </script>
  <script src="./mail.js"></script>
  <script src="./support.js"></script>
  <script src="./reef-bg.js"></script>
</body>
</html>
