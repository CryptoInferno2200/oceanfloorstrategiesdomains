<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#041016" />
  <title>OFS Domains — Vault</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icon.svg" />
  <style>
    :root { --bg:#041016; --fg:#eef4f2; --muted:#9bb0aa; --card:rgba(8,22,28,.88); --line:rgba(238,244,242,.12); }
    * { box-sizing: border-box; }
    body { margin:0; font:16px/1.5 ui-sans-serif,system-ui; background:var(--bg); color:var(--fg); }
    header, main { max-width:720px; margin:0 auto; padding:24px 20px; }
    nav { display:flex; flex-wrap:wrap; gap:8px; margin:12px 0 0; }
    nav a { color:var(--muted); text-decoration:none; font-size:13px; padding:8px 12px; border-radius:999px; box-shadow:0 0 0 1px var(--line); }
    nav a.on { color:var(--fg); background:var(--card); }
    h1 { font-family:Georgia,serif; font-weight:400; letter-spacing:-.03em; }
    .k, .lead { color:var(--muted); }
    .k { font-size:11px; letter-spacing:.16em; text-transform:uppercase; }
    .card { margin-top:16px; padding:18px; border-radius:16px; background:var(--card); box-shadow:0 0 0 1px var(--line); }
    ul { margin:10px 0 0; padding-left:18px; color:var(--muted); }
    li { margin:8px 0; }
    ul.rows { list-style:none; padding:0; display:grid; gap:8px; }
    ul.rows li { display:grid; grid-template-columns:1fr auto; gap:6px 16px; margin:0; padding:12px; border-radius:12px; box-shadow:inset 0 0 0 1px var(--line); }
    ul.rows li.empty { display:block; }
    ul.rows strong { color:var(--fg); font-weight:600; }
    .row-side { color:var(--fg); white-space:nowrap; }
    .row-meta { grid-column:1 / -1; font-size:13px; }
    .badge { display:inline-block; font-size:11px; letter-spacing:.06em; padding:2px 8px; border-radius:999px; box-shadow:0 0 0 1px var(--line); color:var(--fg); }
    .badge.ok { background:rgba(120,200,160,.16); }
    .badge.wait { background:rgba(200,190,120,.14); }
    .badge.bad { background:rgba(224,140,130,.18); }
    a.ghost-link { display:inline-block; margin-top:12px; padding:10px 14px; border-radius:12px; color:var(--fg); text-decoration:none; font-size:14px; box-shadow:0 0 0 1px var(--line); }
    a.ghost-link[hidden] { display:none; }
  </style>
  <link rel="stylesheet" href="./reef-bg.css" />
</head>
<body>
<canvas id="ofs-reef" class="ofs-reef" aria-hidden="true"></canvas>

  <header>
    <div class="k">OFS Vault</div>
    <h1>Vault.</h1>
    <p class="lead">Every service this seat bought or received complimentary.</p>
    <nav>
      <a href="home.html">Home</a>
      <a href="auto.html">Auto</a>
      <a href="bundle.html">Products</a>
      <a href="profile.html">Profile</a>
      <a href="workspace.html">Workspace</a>
      <a href="sauce.html">Sauce</a>
      <a class="on" href="vault.html">Vault</a>
      <a href="bind.html">Bind</a>
      <a href="host.html">Host</a>
      <a href="live.html">Go live</a>
    </nav>
  </header>
  <main>
    <div class="card">
      <div class="k">Purchases</div>
      <p class="lead" id="who">Checking your sign-in…</p>
      <a class="ghost-link" id="vault-signin" href="home.html" hidden>Sign in on Home</a>
      <ul id="history" class="rows"></ul>
    </div>
  </main>
  <script src="./auth.js"></script>
  <script src="./purchases.js"></script>
  <script type="module" src="./assets/js/vault-inline-1.js"></script>
  <script src="./mail.js"></script>
  <script src="./support.js"></script>
  <script src="./reef-bg.js"></script>
</body>
</html>
